local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0   #5.0
      publish_frequency: 2.0  #2.0
      always_send_full_costmap: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      #footprint: "[[0.35, 0.30], [0.35, -0.30], [-0.35, -0.30], [-0.35, 0.30]]"
      footprint: "[[0.38, 0.30], [0.38, -0.30], [-0.38, -0.30], [-0.38, 0.30]]"
      plugins: ["obstacle_layer_front", "obstacle_layer_back", "inflation_layer"]
      obstacle_layer_front:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_front
        scan_front:
          topic: /scan_0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.7
          obstacle_max_range: 4.5
          obstacle_min_range: 0.7
      obstacle_layer_back:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_back
        scan_back:
          topic: /scan_1
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.7
          obstacle_max_range: 4.5
          obstacle_min_range: 0.7
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 0.3 #0.75
      always_send_full_costmap: true
