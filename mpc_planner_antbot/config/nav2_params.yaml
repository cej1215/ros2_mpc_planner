amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.9 #0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.02 #0.5
    beam_skip_error_threshold: 0.9 #0.9
    beam_skip_threshold: 0.1 #0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60 #60
    max_particles: 3000  #2000
    min_particles: 1500  #500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1 #1
    # OmniMotionModel is critical for holonomic swerve-drive robot
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2 #0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.02 #0.2
    update_min_d: 0.025 #0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names:
      - "map_server"
      - "amcl"

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # controller_server / behavior_server / bt_navigator / smoother_server 제거.
    # local_costmap 은 별도 노드이므로 mpc_costmap_params.yaml 참고.
    node_names:
      - "planner_server"